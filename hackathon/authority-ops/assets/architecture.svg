<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700">Authority Ops</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20">Strands agent → delegated authority → controlled execution → evidence</text>
  <rect x="60" y="170" width="260" height="150" rx="18" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
