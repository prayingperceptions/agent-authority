  <text x="635" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Gate • Score • Evidence</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
  <line x1="320" y1="245" x2="470" y2="245" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="50" y="410" width="200" height="95" rx="16" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <rect x="310" y="410" width="200" height="95" rx="16" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <rect x="570" y="410" width="200" height="95" rx="16" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <rect x="830" y="410" width="300" height="95" rx="16" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
  <text x="150" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">ALLOW</text>
  <text x="410" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">ASK</text>
  <text x="670" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">DENY</text>
  <text x="980" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Ledger Receipt</text>
