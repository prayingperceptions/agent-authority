  <line x1="635" y1="350" x2="410" y2="410" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="350" x2="670" y2="410" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="457" x2="830" y2="457" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Proposal ≠ Authorization ≠ Execution ≠ Outcome</text>
