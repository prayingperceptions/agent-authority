  <text x="190" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">reason • propose • use tools</text>
  <rect x="470" y="140" width="330" height="210" rx="18" fill="#f5f5f5" stroke="#111" stroke-width="2"/>
